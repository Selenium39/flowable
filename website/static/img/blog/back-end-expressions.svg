<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
    <!-- 背景 -->
    <rect width="800" height="400" fill="#f8f9fa"/>
    
    <!-- 装饰性图形 -->
    <path d="M0,200 Q400,50 800,200" stroke="#e9ecef" stroke-width="2" fill="none"/>
    <path d="M0,250 Q400,100 800,250" stroke="#e9ecef" stroke-width="2" fill="none"/>
    
    <!-- 主标题 -->
    <text x="400" y="150" font-family="Arial, sans-serif" font-size="40" font-weight="bold" text-anchor="middle" fill="#212529">
        Flowable 后端表达式
    </text>
    
    <!-- 表达式示例 -->
    <g transform="translate(200,220)">
        <rect x="0" y="0" width="400" height="40" rx="5" fill="#ffffff" stroke="#dee2e6"/>
        <text x="20" y="27" font-family="monospace" font-size="16" fill="#495057">
            ${flwTimeUtils.now()}
        </text>
    </g>
    
    <g transform="translate(200,270)">
        <rect x="0" y="0" width="400" height="40" rx="5" fill="#ffffff" stroke="#dee2e6"/>
        <text x="20" y="27" font-family="monospace" font-size="16" fill="#495057">
            ${execution.setVariable(varName, value)}
        </text>
    </g>
    
    <!-- 闪电图标 -->
    <g transform="translate(650,200)">
        <path d="M20,0 L0,25 L15,25 L5,50 L35,20 L20,20 Z" fill="#ffd43b"/>
    </g>
</svg> 