<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="500" viewBox="0 0 900 500">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
  </defs>
  
  <!-- 开始事件 -->
  <circle cx="50" cy="250" r="20" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <circle cx="50" cy="250" r="14" fill="#ffffff" stroke="#333" stroke-width="1"/>
  
  <!-- 连线: 开始 -> 填写采购申请 -->
  <line x1="70" y1="250" x2="110" y2="250" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 填写采购申请任务 -->
  <rect x="120" y="220" width="120" height="60" rx="10" ry="10" fill="#ffffff" stroke="#2196F3" stroke-width="2"/>
  <text x="180" y="255" font-family="Arial" font-size="14" text-anchor="middle">填写采购申请</text>
  
  <!-- 连线: 填写采购申请 -> 金额网关 -->
  <line x1="240" y1="250" x2="290" y2="250" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 金额网关(排他) -->
  <rect x="300" y="230" width="40" height="40" fill="#ffffff" stroke="#333" stroke-width="2" transform="rotate(45 320 250)"/>
  <text x="320" y="253" font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle">X</text>
  
  <!-- 连线: 金额网关 -> 小额路径(或签) -->
  <line x1="340" y1="220" x2="380" y2="150" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="370" y="170" font-family="Arial" font-size="12" fill="#666">≤10000</text>
  
  <!-- 连线: 金额网关 -> 大额路径(并行) -->
  <line x1="340" y1="280" x2="380" y2="350" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="370" y="330" font-family="Arial" font-size="12" fill="#666">>10000</text>
  
  <!-- 或签任务(小额) -->
  <rect x="390" y="120" width="120" height="60" rx="10" ry="10" fill="#ffffff" stroke="#2196F3" stroke-width="2"/>
  <text x="450" y="145" font-family="Arial" font-size="14" text-anchor="middle">经理审批</text>
  <text x="450" y="165" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(或签)</text>
  
  <!-- 连线: 或签 -> 结束事件 -->
  <line x1="510" y1="150" x2="780" y2="250" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 并行网关(分叉) -->
  <rect x="390" y="330" width="40" height="40" fill="#ffffff" stroke="#333" stroke-width="2" transform="rotate(45 410 350)"/>
  <line x1="400" y1="350" x2="420" y2="350" stroke="#333" stroke-width="2"/>
  <line x1="410" y1="340" x2="410" y2="360" stroke="#333" stroke-width="2"/>
  
  <!-- 连线: 并行网关 -> 部门审批(会签) -->
  <line x1="430" y1="330" x2="470" y2="280" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 连线: 并行网关 -> 财务审核 -->
  <line x1="430" y1="370" x2="470" y2="420" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 会签任务(部门) -->
  <rect x="480" y="250" width="120" height="60" rx="10" ry="10" fill="#ffffff" stroke="#2196F3" stroke-width="2"/>
  <text x="540" y="275" font-family="Arial" font-size="14" text-anchor="middle">部门经理审批</text>
  <text x="540" y="295" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">(会签)</text>
  
  <!-- 财务审核任务 -->
  <rect x="480" y="390" width="120" height="60" rx="10" ry="10" fill="#ffffff" stroke="#2196F3" stroke-width="2"/>
  <text x="540" y="425" font-family="Arial" font-size="14" text-anchor="middle">财务审核</text>
  
  <!-- 连线: 会签 -> 并行网关(合并) -->
  <line x1="600" y1="280" x2="640" y2="330" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 连线: 财务审核 -> 并行网关(合并) -->
  <line x1="600" y1="420" x2="640" y2="370" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 并行网关(合并) -->
  <rect x="650" y="330" width="40" height="40" fill="#ffffff" stroke="#333" stroke-width="2" transform="rotate(45 670 350)"/>
  <line x1="660" y1="350" x2="680" y2="350" stroke="#333" stroke-width="2"/>
  <line x1="670" y1="340" x2="670" y2="360" stroke="#333" stroke-width="2"/>
  
  <!-- 连线: 并行网关(合并) -> CEO审批 -->
  <line x1="690" y1="350" x2="730" y2="350" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- CEO审批任务 -->
  <rect x="740" y="320" width="120" height="60" rx="10" ry="10" fill="#ffffff" stroke="#2196F3" stroke-width="2"/>
  <text x="800" y="355" font-family="Arial" font-size="14" text-anchor="middle">CEO审批</text>
  
  <!-- 连线: CEO审批 -> 结束事件 -->
  <line x1="800" y1="320" x2="800" y2="270" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 结束事件 -->
  <circle cx="800" cy="250" r="20" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <circle cx="800" cy="250" r="14" fill="#ffffff" stroke="#333" stroke-width="2"/>
  
  <!-- 标签 -->
  <text x="320" y="200" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">金额判断</text>
  <text x="410" y="315" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">并行审批</text>
  <text x="670" y="315" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">审批汇合</text>
  
  <!-- 流程说明 -->
  <rect x="20" y="460" width="860" height="30" rx="5" ry="5" fill="#f5f5f5" stroke="#ddd"/>
  <text x="450" y="480" font-family="Arial" font-size="14" text-anchor="middle" fill="#555">采购审批流程：结合了分支流、或签流程、会签流程和并行流程</text>
</svg> 