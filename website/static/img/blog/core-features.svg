<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
    <!-- 背景 -->
    <rect width="100%" height="100%" fill="#f8f9fa"/>
    
    <!-- 中心圆 -->
    <circle cx="400" cy="200" r="80" fill="#1f3245"/>
    <text x="400" y="205" text-anchor="middle" fill="white" font-family="Arial" font-size="16">工作流引擎</text>
    
    <!-- 功能模块 -->
    <g>
        <!-- 流程设计 -->
        <circle cx="250" cy="120" r="50" fill="#a0cc47"/>
        <text x="250" y="125" text-anchor="middle" fill="white" font-family="Arial" font-size="14">流程设计</text>
        <line x1="310" y1="150" x2="350" y2="170" stroke="#666" stroke-width="2"/>
        
        <!-- 状态管理 -->
        <circle cx="550" cy="120" r="50" fill="#a0cc47"/>
        <text x="550" y="125" text-anchor="middle" fill="white" font-family="Arial" font-size="14">状态管理</text>
        <line x1="490" y1="150" x2="450" y2="170" stroke="#666" stroke-width="2"/>
        
        <!-- 任务调度 -->
        <circle cx="250" cy="280" r="50" fill="#a0cc47"/>
        <text x="250" y="285" text-anchor="middle" fill="white" font-family="Arial" font-size="14">任务调度</text>
        <line x1="310" y1="250" x2="350" y2="230" stroke="#666" stroke-width="2"/>
        
        <!-- 监控分析 -->
        <circle cx="550" cy="280" r="50" fill="#a0cc47"/>
        <text x="550" y="285" text-anchor="middle" fill="white" font-family="Arial" font-size="14">监控分析</text>
        <line x1="490" y1="250" x2="450" y2="230" stroke="#666" stroke-width="2"/>
    </g>
    
    <!-- 标题 -->
    <text x="400" y="50" text-anchor="middle" font-family="Arial" font-size="24" fill="#1f3245">
        核心功能架构
    </text>
</svg> 