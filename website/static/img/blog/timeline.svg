<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="300" xmlns="http://www.w3.org/2000/svg">
    <!-- 背景 -->
    <rect width="100%" height="100%" fill="#f8f9fa"/>
    
    <!-- 时间线 -->
    <line x1="100" y1="150" x2="700" y2="150" stroke="#1f3245" stroke-width="4"/>
    
    <!-- 1990年代 -->
    <circle cx="150" cy="150" r="10" fill="#a0cc47"/>
    <text x="150" y="180" text-anchor="middle" font-family="Arial" font-size="12">1990年代</text>
    <text x="150" y="120" text-anchor="middle" font-family="Arial" font-size="12">早期阶段</text>
    
    <!-- 2004年 -->
    <circle cx="300" cy="150" r="10" fill="#a0cc47"/>
    <text x="300" y="180" text-anchor="middle" font-family="Arial" font-size="12">2004年</text>
    <text x="300" y="120" text-anchor="middle" font-family="Arial" font-size="12">jBPM诞生</text>
    
    <!-- 2010年 -->
    <circle cx="450" cy="150" r="10" fill="#a0cc47"/>
    <text x="450" y="180" text-anchor="middle" font-family="Arial" font-size="12">2010年</text>
    <text x="450" y="120" text-anchor="middle" font-family="Arial" font-size="12">Activiti发布</text>
    
    <!-- 2018年 -->
    <circle cx="600" cy="150" r="10" fill="#a0cc47"/>
    <text x="600" y="180" text-anchor="middle" font-family="Arial" font-size="12">2018年</text>
    <text x="600" y="120" text-anchor="middle" font-family="Arial" font-size="12">Flowable发布</text>
    
    <!-- 标题 -->
    <text x="400" y="50" text-anchor="middle" font-family="Arial" font-size="24" fill="#1f3245">
        工作流引擎发展历程
    </text>
</svg> 