<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
    <!-- 背景 -->
    <rect width="100%" height="100%" fill="#f8f9fa"/>
    
    <!-- 流程节点 -->
    <g transform="translate(40,200)">
        <!-- 开始节点 -->
        <circle cx="30" cy="0" r="20" fill="#1f3245"/>
        <text x="30" y="5" text-anchor="middle" fill="white" font-family="Arial" font-size="12">开始</text>
        
        <!-- 连接线1 -->
        <line x1="50" y1="0" x2="90" y2="0" stroke="#a0cc47" stroke-width="2"/>
        <polygon points="90,5 100,0 90,-5" fill="#a0cc47"/>
        
        <!-- 审批任务 -->
        <rect x="100" y="-30" width="100" height="60" rx="10" fill="#1f3245"/>
        <text x="150" y="5" text-anchor="middle" fill="white" font-family="Arial" font-size="12">审批假期</text>
        
        <!-- 连接线2 -->
        <line x1="200" y1="0" x2="240" y2="0" stroke="#a0cc47" stroke-width="2"/>
        <polygon points="240,5 250,0 240,-5" fill="#a0cc47"/>
        
        <!-- 网关 -->
        <rect x="250" y="-20" width="40" height="40" fill="#1f3245" transform="rotate(45 270 0)"/>
        <text x="270" y="5" text-anchor="middle" fill="white" font-family="Arial" font-size="12">X</text>
        
        <!-- 上分支连接线和文字 -->
        <line x1="290" y1="-20" x2="330" y2="-70" stroke="#a0cc47" stroke-width="2"/>
        <polygon points="330,-65 340,-70 330,-75" fill="#a0cc47"/>
        <text x="310" y="-50" text-anchor="middle" fill="#1f3245" font-family="Arial" font-size="12">同意</text>
        
        <!-- 下分支连接线和文字 -->
        <line x1="290" y1="20" x2="330" y2="70" stroke="#a0cc47" stroke-width="2"/>
        <polygon points="330,75 340,70 330,65" fill="#a0cc47"/>
        <text x="310" y="50" text-anchor="middle" fill="#1f3245" font-family="Arial" font-size="12">拒绝</text>
        
        <!-- 上分支：系统调用 -->
        <rect x="340" y="-100" width="120" height="60" rx="10" fill="#1f3245"/>
        <text x="400" y="-65" text-anchor="middle" fill="white" font-family="Arial" font-size="12">录入假期系统</text>
        
        <!-- 下分支：发送邮件 -->
        <rect x="340" y="40" width="120" height="60" rx="10" fill="#1f3245"/>
        <text x="400" y="75" text-anchor="middle" fill="white" font-family="Arial" font-size="12">发送拒绝邮件</text>
        
        <!-- 上分支连接线2 -->
        <line x1="460" y1="-70" x2="500" y2="-70" stroke="#a0cc47" stroke-width="2"/>
        <polygon points="500,-65 510,-70 500,-75" fill="#a0cc47"/>
        
        <!-- 上分支：假期已批准 -->
        <rect x="510" y="-100" width="120" height="60" rx="10" fill="#1f3245"/>
        <text x="570" y="-65" text-anchor="middle" fill="white" font-family="Arial" font-size="12">假期已批准</text>
        
        <!-- 上分支结束节点 -->
        <line x1="630" y1="-70" x2="670" y2="-70" stroke="#a0cc47" stroke-width="2"/>
        <polygon points="670,-65 680,-70 670,-75" fill="#a0cc47"/>
        <circle cx="700" cy="-70" r="20" fill="#1f3245"/>
        <text x="700" y="-65" text-anchor="middle" fill="white" font-family="Arial" font-size="12">结束</text>
        
        <!-- 下分支结束节点 -->
        <line x1="460" y1="70" x2="500" y2="70" stroke="#a0cc47" stroke-width="2"/>
        <polygon points="500,75 510,70 500,65" fill="#a0cc47"/>
        <circle cx="530" cy="70" r="20" fill="#1f3245"/>
        <text x="530" y="75" text-anchor="middle" fill="white" font-family="Arial" font-size="12">结束</text>
    </g>
    
    <!-- 标题 -->
    <text x="400" y="50" text-anchor="middle" font-family="Arial" font-size="24" fill="#1f3245">
        假期申请流程
    </text>
</svg> 