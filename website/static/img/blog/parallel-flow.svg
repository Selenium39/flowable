<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="350" viewBox="0 0 800 350">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
  </defs>
  
  <!-- 开始事件 -->
  <circle cx="50" cy="175" r="20" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <circle cx="50" cy="175" r="14" fill="#ffffff" stroke="#333" stroke-width="1"/>
  
  <!-- 连线: 开始 -> 并行网关(分叉) -->
  <line x1="70" y1="175" x2="140" y2="175" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 并行网关(分叉) -->
  <rect x="150" y="155" width="40" height="40" fill="#ffffff" stroke="#333" stroke-width="2" transform="rotate(45 170 175)"/>
  <line x1="160" y1="175" x2="180" y2="175" stroke="#333" stroke-width="2"/>
  <line x1="170" y1="165" x2="170" y2="185" stroke="#333" stroke-width="2"/>
  
  <!-- 连线: 并行网关 -> 三个任务 -->
  <line x1="190" y1="175" x2="220" y2="85" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="190" y1="175" x2="240" y2="175" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="190" y1="175" x2="220" y2="265" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 任务1: 文档审查 -->
  <rect x="240" y="55" width="120" height="60" rx="10" ry="10" fill="#ffffff" stroke="#2196F3" stroke-width="2"/>
  <text x="300" y="90" font-family="Arial" font-size="14" text-anchor="middle">文档审查</text>
  
  <!-- 任务2: 技术评估 -->
  <rect x="260" y="145" width="120" height="60" rx="10" ry="10" fill="#ffffff" stroke="#2196F3" stroke-width="2"/>
  <text x="320" y="180" font-family="Arial" font-size="14" text-anchor="middle">技术评估</text>
  
  <!-- 任务3: 财务审核 -->
  <rect x="240" y="235" width="120" height="60" rx="10" ry="10" fill="#ffffff" stroke="#2196F3" stroke-width="2"/>
  <text x="300" y="270" font-family="Arial" font-size="14" text-anchor="middle">财务审核</text>
  
  <!-- 连线: 任务 -> 并行网关(合并) -->
  <line x1="360" y1="85" x2="530" y2="175" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="380" y1="175" x2="530" y2="175" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="360" y1="265" x2="530" y2="175" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 并行网关(合并) -->
  <rect x="540" y="155" width="40" height="40" fill="#ffffff" stroke="#333" stroke-width="2" transform="rotate(45 560 175)"/>
  <line x1="550" y1="175" x2="570" y2="175" stroke="#333" stroke-width="2"/>
  <line x1="560" y1="165" x2="560" y2="185" stroke="#333" stroke-width="2"/>
  
  <!-- 连线: 并行网关(合并) -> 最终审批 -->
  <line x1="580" y1="175" x2="630" y2="175" stroke="#888" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 最终审批任务 -->
  <rect x="640" y="145" width="120" height="60" rx="10" ry="10" fill="#ffffff" stroke="#2196F3" stroke-width="2"/>
  <text x="700" y="180" font-family="Arial" font-size="14" text-anchor="middle">最终审批</text>
  
  <!-- 标签 -->
  <text x="170" y="140" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">分叉</text>
  <text x="560" y="140" font-family="Arial" font-size="12" text-anchor="middle" fill="#666">汇合</text>
</svg> 