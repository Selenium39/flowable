<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="600" height="240" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="600" height="240" fill="#f9f9f9"/>
  
  <!-- 标题 -->
  <text x="50" y="30" font-family="Arial" font-size="18" font-weight="bold" fill="#333">会签流程模式</text>
  
  <!-- 开始节点 -->
  <circle cx="70" cy="120" r="20" fill="#b3ffb3" stroke="#008000" stroke-width="2"/>
  <text x="70" y="124" font-family="Arial" font-size="10" text-anchor="middle">开始</text>
  
  <!-- 初始任务 -->
  <rect x="120" y="100" width="100" height="40" rx="5" fill="#f0f0ff" stroke="#0000cc" stroke-width="2"/>
  <text x="170" y="124" font-family="Arial" font-size="10" text-anchor="middle">提交申请</text>
  
  <!-- 连接线 -->
  <line x1="90" y1="120" x2="120" y2="120" stroke="#333" stroke-width="1.5"/>
  <polygon points="118,116 120,120 118,124" fill="#333"/>
  
  <!-- 会签任务区域 -->
  <rect x="250" y="60" width="180" height="120" rx="5" fill="#fff" stroke="#666" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="340" y="80" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">会签审批</text>
  
  <!-- 会签任务 - 三个审批人 -->
  <rect x="270" y="90" width="140" height="25" rx="5" fill="#ffe6e6" stroke="#cc0000" stroke-width="1.5"/>
  <text x="340" y="107" font-family="Arial" font-size="10" text-anchor="middle">经理A审批</text>
  
  <rect x="270" y="125" width="140" height="25" rx="5" fill="#ffe6e6" stroke="#cc0000" stroke-width="1.5"/>
  <text x="340" y="142" font-family="Arial" font-size="10" text-anchor="middle">经理B审批</text>
  
  <rect x="270" y="160" width="140" height="25" rx="5" fill="#ffe6e6" stroke="#cc0000" stroke-width="1.5"/>
  <text x="340" y="177" font-family="Arial" font-size="10" text-anchor="middle">经理C审批</text>
  
  <!-- 连接线 -->
  <line x1="220" y1="120" x2="250" y2="120" stroke="#333" stroke-width="1.5"/>
  <polygon points="248,116 250,120 248,124" fill="#333"/>
  
  <!-- 最终任务 -->
  <rect x="460" y="100" width="100" height="40" rx="5" fill="#e6ffff" stroke="#006666" stroke-width="2"/>
  <text x="510" y="124" font-family="Arial" font-size="10" text-anchor="middle">申请完成</text>
  
  <!-- 连接线 -->
  <line x1="430" y1="120" x2="460" y2="120" stroke="#333" stroke-width="1.5"/>
  <polygon points="458,116 460,120 458,124" fill="#333"/>
  
  <!-- 条件说明 -->
  <text x="350" y="200" font-family="Arial" font-size="11" text-anchor="middle" font-style="italic" fill="#666">所有审批人必须全部同意</text>
  <text x="250" y="220" font-family="Arial" font-size="11" text-anchor="start" fill="#333">completionCondition=${nrOfCompletedInstances == nrOfInstances}</text>
</svg> 