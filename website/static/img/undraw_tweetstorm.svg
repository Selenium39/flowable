<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="600" xmlns="http://www.w3.org/2000/svg">
    <!-- 背景 -->
    <rect width="100%" height="100%" fill="#f8f9fa"/>
    
    <!-- 装饰图案 -->
    <path d="M800,0 Q1000,300 800,600 L1200,600 L1200,0 Z" fill="#1f3245" opacity="0.1"/>
    <path d="M850,0 Q1050,300 850,600 L1200,600 L1200,0 Z" fill="#a0cc47" opacity="0.1"/>
    
    <!-- 左侧内容区域 -->
    <g transform="translate(80,100)">
        <!-- Flowable Logo -->
        <circle cx="40" cy="40" r="35" fill="#1f3245"/>
        <path d="M20,40 L60,40 M40,20 L40,60" stroke="#a0cc47" stroke-width="5"/>
        
        <!-- 标题 -->
        <text x="100" y="35" font-family="Arial" font-size="40" font-weight="bold" fill="#1f3245">
            Flowable 中文文档
        </text>
        <text x="100" y="75" font-family="Arial" font-size="24" fill="#666">
            开源工作流引擎
        </text>
    </g>
    
    <!-- 特性列表 -->
    <g transform="translate(100,200)">
        <g transform="translate(0,0)">
            <circle cx="15" cy="15" r="10" fill="#a0cc47"/>
            <text x="40" y="22" font-family="Arial" font-size="20" fill="#1f3245">BPMN 2.0 标准支持</text>
        </g>
        
        <g transform="translate(0,50)">
            <circle cx="15" cy="15" r="10" fill="#a0cc47"/>
            <text x="40" y="22" font-family="Arial" font-size="20" fill="#1f3245">Spring Boot 集成</text>
        </g>
        
        <g transform="translate(0,100)">
            <circle cx="15" cy="15" r="10" fill="#a0cc47"/>
            <text x="40" y="22" font-family="Arial" font-size="20" fill="#1f3245">云原生架构支持</text>
        </g>
        
        <g transform="translate(0,150)">
            <circle cx="15" cy="15" r="10" fill="#a0cc47"/>
            <text x="40" y="22" font-family="Arial" font-size="20" fill="#1f3245">高性能与可扩展性</text>
        </g>
    </g>
    
    <!-- 右侧流程图 -->
    <g transform="translate(500,200)">
        <!-- 简化的BPMN图 -->
        <circle cx="50" cy="150" r="25" fill="#1f3245"/>
        <text x="50" y="155" text-anchor="middle" fill="white" font-family="Arial" font-size="14">开始</text>
        
        <line x1="75" y1="150" x2="175" y2="150" stroke="#a0cc47" stroke-width="3"/>
        <polygon points="175,155 185,150 175,145" fill="#a0cc47"/>
        
        <rect x="185" y="120" width="120" height="60" rx="10" fill="#1f3245"/>
        <text x="245" y="155" text-anchor="middle" fill="white" font-family="Arial" font-size="14">审批任务</text>
        
        <line x1="305" y1="150" x2="405" y2="150" stroke="#a0cc47" stroke-width="3"/>
        <polygon points="405,155 415,150 405,145" fill="#a0cc47"/>
        
        <circle cx="435" cy="150" r="25" fill="#1f3245"/>
        <text x="435" y="155" text-anchor="middle" fill="white" font-family="Arial" font-size="14">结束</text>
    </g>
    
    <!-- 底部信息 -->
    <text x="100" y="520" font-family="Arial" font-size="24" fill="#666">
        访问 flowable.me 获取更多信息
    </text>
</svg> 